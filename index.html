<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ CONFIG ============ */
const firebaseConfig={apiKey:"AIzaSyBcXm5QQaYCCddVXNgGqTBAszdKEK-0PJQ",authDomain:"multi-service-app-77dd8.firebaseapp.com",projectId:"multi-service-app-77dd8",storageBucket:"multi-service-app-77dd8.appspot.com",messagingSenderId:"123732555482",appId:"1:123732555482:web:ea47c825e0dbb504f597e3"};
const CLOUD="dbirgrdbp";
const DEFAULT_PRESET="ml_default";      // admin can change this in Settings (no code edit needed)
const BOOT_PASS="Admin@123";            // first login: mobile "admin" / this password. Change it in Settings!
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),U=db.collection('sentinel_users'),K=db.collection('sentinel_tickets'),C=db.doc('sentinel_config/app');
const now=()=>firebase.firestore.FieldValue.serverTimestamp();

const CAT={'Power / Fan':['','fa-bolt'],'Water / Plumbing':['','fa-droplet'],'Hygiene & Sanitation':['','fa-broom'],'Furniture & Benches':['','fa-chair'],'Mess & Canteen':['','fa-utensils'],'Safety & Hazard':['','fa-triangle-exclamation'],'IT / Network':['','fa-wifi'],'Other':['','fa-ellipsis']};
const DEPTS=['CS','AI&DS','IT','E&TC','E&CE','AR','CIVIL','MECH','ELECTRICAL','Amrut Kalamanch','Amphitheater','Vasantdada Ground','Medha Ground','Central Library','Mess & Canteen','Parking Area','Boys Hostel','Girls Hostel'];
const FLOORS=['Ground','1st','2nd','3rd','4th'];
const TRADES=['Electrician','Plumber','IT Staff','Estate / Carpentry','Housekeeping','Other'];

/* ============ HELPERS ============ */
const S={me:null,tab:'guest',tickets:[],users:[],cfg:{},cat:'Power / Fan',floor:'Ground',photo:null,filter:'all',gtab:'login',unsubs:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=r=>r.createdAt?.toMillis?.()||Date.now();
const code=t=>'T-'+t.id.slice(-4).toUpperCase();
const ago=ms=>{const m=Math.max(0,Math.round((Date.now()-ms)/6e4));return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3200)};
const CARD='bg-[#0F1A2E] border border-[#1E2B45] rounded-2xl p-3.5';
const INP='w-full bg-[#0A1424] border border-[#1E2B45] rounded-xl px-3.5 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500';
const B='font-semibold rounded-xl py-2.5 text-sm transition active:scale-[.98]';
const P='bg-blue-600 hover:bg-blue-500 text-white';
const COL={amber:'bg-amber-500/10 text-amber-400 border-amber-500/30',blue:'bg-blue-500/10 text-blue-400 border-blue-500/30',green:'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',red:'bg-red-500/10 text-red-400 border-red-500/30',slate:'bg-slate-500/10 text-slate-300 border-slate-500/30'};
const bd=(t,c)=>`<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${COL[c]}">${t}</span>`;
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const lbl=t=>`<label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">${t}</label>`;
const head=(t,s='')=>`<div><h2 class="text-lg font-bold text-white">${t}</h2>${s?`<p class="text-xs text-slate-400 mt-0.5">${s}</p>`:''}</div>`;
async function hash(m,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m+':'+p+':avcoe-sentinel'));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const isAdmin=()=>S.me?.role==='admin',isStaff=()=>S.me?.role==='staff';
const open=t=>t.approval==='approved'&&t.status!=='Resolved';

function modal(h){$('modal').innerHTML=`<div class="absolute inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeM()"><div class="w-full bg-[#0F1A2E] border border-[#1E2B45] rounded-t-3xl sm:rounded-3xl p-5 space-y-3 max-h-[90%] overflow-y-auto sc">${h}</div></div>`}
function closeM(){$('modal').innerHTML=''}

/* ============ CLOUDINARY ============ */
function shrink(file,max=1280){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||file),'image/jpeg',.82)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}
async function upload(file){
  const formData=new FormData();
  formData.append('file',await shrink(file),'photo.jpg');
  formData.append('upload_preset',S.cfg.cloudPreset||DEFAULT_PRESET);
  const response=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:'POST',body:formData});
  const data=await response.json();
  if(data.secure_url)return data.secure_url;
  throw new Error(data.error?.message||'Cloudinary upload failed');
}
async function tryUpload(file){
  if(!file)return '';
  try{return await upload(file)}catch(e){if(!confirm('Photo upload failed: '+e.message+'\n\nContinue without photo?'))throw new Error('cancelled');return ''}
}

/* ============ AUTH ============ */
function err(m){const e=$('gerr');if(e){e.textContent=m;e.classList.remove('hidden')}else toast(m)}
async function login(){
  const m=$('lm').value.trim().toLowerCase(),p=$('lp').value;
  if(!m||!p)return err('Enter mobile number and password');
  try{
    let d=await U.doc(m).get();
    if(!d.exists&&m==='admin'&&p===BOOT_PASS){await U.doc('admin').set({name:'Administrator',mobile:'admin',role:'admin',status:'active',pass:await hash('admin',p),createdAt:now()});d=await U.doc('admin').get()}
    if(!d.exists||d.data().pass!==await hash(m,p))return err('Invalid mobile number or password');
    const u=d.data();
    if(u.status==='pending')return err('Your registration is awaiting admin approval');
    if(u.status!=='active')return err('This account is '+u.status+'. Contact admin.');
    start(m);
  }catch(e){err('Login failed: '+e.message)}
}
async function register(){
  const name=$('rn').value.trim(),m=$('rm').value.trim(),dept=$('rd').value,p=$('rp').value;
  if(name.length<2)return err('Enter your full name');
  if(!/^\d{10}$/.test(m))return err('Enter a valid 10-digit mobile number');
  if(p.length<6)return err('Password must be at least 6 characters');
  try{
    if((await U.doc(m).get()).exists)return err('This mobile number is already registered');
    await U.doc(m).set({name,mobile:m,dept,role:'student',status:'pending',pass:await hash(m,p),createdAt:now()});
    S.gtab='login';go('guest');toast('Registered! Wait for admin approval, then log in.');
  }catch(e){err('Registration failed: '+e.message)}
}
function start(m){
  localStorage.setItem('sentinelMobile',m);stop();
  S.unsubs.push(U.doc(m).onSnapshot(d=>{
    if(!d.exists||d.data().status!=='active'){toast('Your account is no longer active');logout();return}
    const first=!S.me;S.me={...d.data(),id:d.id};
    if(first){S.tab='home';listenData()}
    render();
  }));
}
function listenData(){
  S.unsubs.push(K.orderBy('createdAt','desc').limit(500).onSnapshot(s=>{S.tickets=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast('Database error: '+e.code)));
  if(isAdmin())S.unsubs.push(U.onSnapshot(s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
}
function stop(){S.unsubs.forEach(u=>u());S.unsubs=[]}
function logout(){stop();localStorage.removeItem('sentinelMobile');S.me=null;S.tickets=[];S.users=[];closeM();go('guest')}
C.onSnapshot(d=>{S.cfg=d.exists?d.data():{}});

/* ============ NAV / RENDER ============ */
function go(t){S.tab=t;$('view').dataset.t='';render()}
function navItems(){
  if(isAdmin())return[['home','fa-chart-pie','Dashboard'],['approvals','fa-circle-check','Approvals'],['tickets','fa-list-check','Tickets'],['users','fa-users','Users'],['settings','fa-gear','Settings']];
  if(isStaff())return[['home','fa-briefcase','My Jobs'],['campus','fa-map-location-dot','Campus']];
  return[['home','fa-house','Home'],['report','fa-circle-plus','Report'],['campus','fa-map-location-dot','Campus']];
}
function pendingCount(){return S.tickets.filter(t=>t.approval==='pending').length+S.users.filter(u=>u.status==='pending').length}
function render(){
  if(!S.me){$('nav').innerHTML='';$('hdr').innerHTML='';if($('view').dataset.t!=='guest'){$('view').innerHTML=vGuest();$('view').dataset.t='guest'}return}
  $('hdr').innerHTML=`<div class="text-right leading-tight"><div class="text-[12px] font-semibold text-white">${esc(S.me.name)}</div><div class="text-[10px] text-slate-400 capitalize">${S.me.role}${S.me.trade?' • '+esc(S.me.trade):''}</div></div><button onclick="logout()" title="Sign out" class="w-8 h-8 rounded-full bg-slate-800 border border-[#1E2B45] text-slate-300 text-xs"><i class="fa-solid fa-right-from-bracket"></i></button>`;
  const pc=isAdmin()?pendingCount():0;
  $('nav').innerHTML=navItems().map(([k,i,l])=>`<button onclick="go('${k}')" class="relative flex flex-col items-center gap-0.5 px-3 py-1 text-[10px] font-medium ${S.tab===k?'text-blue-400':'text-slate-500'}"><i class="fa-solid ${i} text-[15px]"></i>${l}${k==='approvals'&&pc?`<span class="absolute -top-0.5 right-0 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[9px] flex items-center justify-center">${pc}</span>`:''}</button>`).join('');
  if(['report','settings'].includes(S.tab)&&$('view').dataset.t===S.tab)return; // don't wipe forms
  const V=isAdmin()?{home:aHome,approvals:aApprovals,tickets:aTickets,users:aUsers,settings:aSettings}:isStaff()?{home:sHome,campus:vCampus}:{home:stHome,report:stReport,campus:vCampus};
  $('view').innerHTML=`<div class="p-5 space-y-4 pb-8">${(V[S.tab]||V.home)()}</div>`;$('view').dataset.t=S.tab;
}

/* ============ TICKET CARD ============ */
function badge(t){return t.approval==='pending'?bd('Awaiting Approval','amber'):t.approval==='rejected'?bd('Rejected','red'):t.status==='Resolved'?bd('Resolved','green'):t.status==='In Progress'?bd('In Progress','blue'):bd('Open','slate')}
function tk(t,act=''){
  const c=CAT[t.category]||['','fa-circle'];
  return `<div class="${CARD} ${t.hazard&&open(t)?'!border-red-500/40':''} space-y-2.5">
  <div class="flex justify-between items-center"><div class="flex items-center gap-2"><span class="text-[10px] font-mono font-bold text-blue-400">${code(t)}</span>${t.hazard?bd('P1 Hazard','red'):''}</div><span class="text-[10px] text-slate-500">${ago(tm(t))}</span></div>
  <div class="flex gap-3"><div class="w-9 h-9 rounded-xl bg-slate-800/70 flex items-center justify-center text-blue-400 shrink-0"><i class="fa-solid ${c[1]}"></i></div><div class="min-w-0"><h4 class="text-[13px] font-semibold text-white leading-snug">${esc(t.title)}</h4><p class="text-[11px] text-slate-400">${esc(t.dept)} • ${esc(t.floor)} • ${esc(t.landmark)}</p></div></div>
  ${t.photoUrl?`<img src="${esc(t.photoUrl)}" loading="lazy" onclick="window.open(this.src)" class="w-full h-36 object-cover rounded-xl border border-[#1E2B45]">`:''}
  <div class="flex items-center justify-between">${badge(t)}<span class="text-[10px] text-slate-500">${t.assignedName?'<i class="fa-solid fa-user-gear"></i> '+esc(t.assignedName):esc(t.reporterName)}</span></div>
  ${t.approval==='rejected'&&t.rejectReason?`<div class="text-[11px] text-red-300 bg-red-500/10 border border-red-500/20 rounded-lg p-2">Reason: ${esc(t.rejectReason)}</div>`:''}
  ${t.status==='Resolved'&&t.approval==='approved'?`<div class="text-[11px] bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2 text-slate-300"><b class="text-emerald-400">Fix note:</b> ${esc(t.resolvedNote||'Issue fixed and verified.')}${t.resolvedBy?` — ${esc(t.resolvedBy)}`:''}${t.proofUrl?`<img src="${esc(t.proofUrl)}" loading="lazy" onclick="window.open(this.src)" class="mt-2 w-full h-28 object-cover rounded-lg">`:''}</div>`:''}
  ${act}</div>`;
}
const empty=t=>`<div class="text-center text-xs text-slate-500 py-8">${t}</div>`;
const stat=(l,v,c='text-white')=>`<div class="${CARD} text-center !p-3"><div class="text-[10px] text-slate-400 uppercase tracking-wider">${l}</div><div class="text-2xl font-extrabold ${c}">${v}</div></div>`;

/* ============ GUEST ============ */
function gtab(t){S.gtab=t;go('guest')}
function vGuest(){
  const L=S.gtab==='login';
  return `<div class="hero min-h-full px-6 py-8 flex flex-col">
  <div class="text-center pt-2"><div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-[10px] font-semibold text-blue-300 uppercase tracking-widest"><i class="fa-solid fa-graduation-cap"></i> AVCOE Sangamner</div>
  <h1 class="text-[28px] font-extrabold mt-3 leading-tight">Campus <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">Sentinel</span></h1>
  <p class="text-xs text-slate-400 mt-2 max-w-[280px] mx-auto">Report, approve and resolve campus issues with live tracking and photo proof.</p></div>
  <div class="${CARD} !p-5 mt-6 space-y-3">
    <div class="grid grid-cols-2 gap-1 p-1 bg-[#0A1424] rounded-xl text-xs font-semibold"><button onclick="gtab('login')" class="py-2 rounded-lg ${L?'bg-blue-600 text-white':'text-slate-400'}">Login</button><button onclick="gtab('reg')" class="py-2 rounded-lg ${L?'text-slate-400':'bg-blue-600 text-white'}">Student Sign Up</button></div>
    ${L?`<input id="lm" inputmode="numeric" placeholder="Mobile number (or admin ID)" class="${INP}"><input id="lp" type="password" placeholder="Password" class="${INP}" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()" class="${B} ${P} w-full">Sign in</button><p class="text-[10px] text-slate-500 text-center">Staff & admin IDs are created by the administrator.</p>`
    :`<input id="rn" placeholder="Full name" class="${INP}"><input id="rm" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" class="${INP}"><select id="rd" class="${INP}">${opts(DEPTS)}</select><input id="rp" type="password" placeholder="Create password (min 6)" class="${INP}">
    <button onclick="register()" class="${B} ${P} w-full">Request Access</button><p class="text-[10px] text-slate-500 text-center">Admin must approve your account before you can log in.</p>`}
    <div id="gerr" class="hidden text-[11px] text-red-300 bg-red-500/10 border border-red-500/20 rounded-lg p-2 text-center"></div>
  </div></div>`;
}

/* ============ STUDENT ============ */
function stHome(){
  const mine=S.tickets.filter(t=>t.reporterMobile===S.me.mobile),fixed=S.tickets.filter(t=>t.approval==='approved'&&t.status==='Resolved');
  return `${head('Hello, '+esc(S.me.name.split(' ')[0]),esc(S.me.dept)+' • live updates')}
  <div class="grid grid-cols-3 gap-2">${stat('My reports',mine.length)}${stat('In progress',mine.filter(t=>t.approval==='approved'&&t.status==='In Progress').length,'text-blue-400')}${stat('Campus fixed',fixed.length,'text-emerald-400')}</div>
  <button onclick="go('report')" class="${B} ${P} w-full py-3.5"><i class="fa-solid fa-plus mr-1"></i> Report a Problem</button>
  <div class="text-xs font-bold uppercase tracking-wider text-slate-300 pt-1">My Reports</div>${mine.map(t=>tk(t)).join('')||empty('You have not reported anything yet')}
  <div class="text-xs font-bold uppercase tracking-wider text-slate-300 pt-2">Recently Fixed on Campus</div>${fixed.slice(0,10).map(t=>tk(t)).join('')||empty('No verified fixes yet')}`;
}
function stReport(){
  return `${head('Report a Problem','Sent to admin for approval, then assigned to staff')}
  <div>${lbl('Category')}<div class="grid grid-cols-4 gap-2">${Object.entries(CAT).map(([k,v])=>`<button type="button" data-c="${esc(k)}" onclick="setCat(this.dataset.c)" class="cb p-2 rounded-xl border text-[10px] font-medium flex flex-col items-center gap-1 text-center ${k===S.cat?'border-blue-500 bg-blue-500/10 text-blue-300':'border-[#1E2B45] bg-[#0A1424] text-slate-400'}"><i class="fa-solid ${v[1]} text-sm"></i>${k.split(' ')[0]}</button>`).join('')}</div></div>
  <div>${lbl('Department / Facility')}<select id="rdept" class="${INP}">${opts(DEPTS,S.me.dept)}</select></div>
  <div>${lbl('Floor')}<div class="grid grid-cols-5 gap-1.5">${FLOORS.map(f=>`<button type="button" onclick="setFloor('${f}')" data-f="${f}" class="fb py-2 rounded-lg border text-xs font-medium ${f===S.floor?'border-blue-500 bg-blue-500/10 text-blue-300':'border-[#1E2B45] bg-[#0A1424] text-slate-400'}">${f}</button>`).join('')}</div></div>
  <div>${lbl('Room / Landmark')}<input id="rland" placeholder="e.g. Computer Lab 3, PC 14" class="${INP}"></div>
  <div>${lbl('Description')}<textarea id="rdesc" rows="3" placeholder="Describe the problem..." class="${INP} resize-none"></textarea></div>
  <div>${lbl('Photo (optional)')}<input type="file" id="rphoto" accept="image/*" capture="environment" class="hidden" onchange="pickPhoto(event)">
  <div id="pbox" onclick="$('rphoto').click()" class="cursor-pointer border-2 border-dashed border-[#1E2B45] rounded-xl p-4 text-center text-xs text-slate-400"><i class="fa-solid fa-camera text-lg text-blue-400 block mb-1"></i><span id="ptxt">Take photo or upload</span></div></div>
  <button id="sbtn" onclick="submitReport()" class="${B} ${P} w-full py-3.5"><i class="fa-solid fa-paper-plane mr-1"></i> Submit Report</button>`;
}
function setCat(c){S.cat=c;document.querySelectorAll('.cb').forEach(b=>b.className=`cb p-2 rounded-xl border text-[10px] font-medium flex flex-col items-center gap-1 text-center ${b.dataset.c===c?'border-blue-500 bg-blue-500/10 text-blue-300':'border-[#1E2B45] bg-[#0A1424] text-slate-400'}`)}
function setFloor(f){S.floor=f;document.querySelectorAll('.fb').forEach(b=>b.className=`fb py-2 rounded-lg border text-xs font-medium ${b.dataset.f===f?'border-blue-500 bg-blue-500/10 text-blue-300':'border-[#1E2B45] bg-[#0A1424] text-slate-400'}`)}
function pickPhoto(e){const f=e.target.files[0];if(!f)return;S.photo=f;$('ptxt').textContent='✓ '+f.name.slice(0,26)+' attached'}
async function submitReport(){
  const landmark=$('rland').value.trim(),desc=$('rdesc').value.trim();
  if(!landmark||!desc)return toast('Fill room/landmark and description');
  const btn=$('sbtn');btn.disabled=true;btn.textContent='Submitting…';
  try{
    if(S.photo)btn.textContent='Uploading photo…';
    const photoUrl=await tryUpload(S.photo);btn.textContent='Saving…';
    await K.add({title:desc.length>44?desc.slice(0,44)+'…':desc,desc,category:S.cat,dept:$('rdept').value,floor:S.floor,landmark,photoUrl,hazard:S.cat==='Safety & Hazard',approval:'pending',status:'Open',assignedTo:'',assignedName:'',reporterMobile:S.me.mobile,reporterName:S.me.name,createdAt:now()});
    S.photo=null;toast('Report sent for admin approval');go('home');
  }catch(e){if(e.message!=='cancelled')toast('Failed: '+e.message);const b=$('sbtn');if(b){b.disabled=false;b.textContent='Submit Report'}}
}

/* ============ CAMPUS HEATMAP + INSIGHTS (shared) ============ */
function heat(){
  return `<div class="grid grid-cols-2 gap-2.5">${DEPTS.map(d=>{const n=S.tickets.filter(t=>open(t)&&t.dept===d).length,z=n>=3?['border-red-500/40','text-red-400','fa-fire']:n?['border-amber-500/30','text-amber-400','fa-triangle-exclamation']:['border-emerald-500/20','text-emerald-400','fa-circle-check'];return `<div class="${CARD} !p-3 ${z[0]}"><div class="text-[10px] font-bold uppercase ${z[1]}"><i class="fa-solid ${z[2]}"></i> ${n?n+' open':'Clear'}</div><div class="text-xs font-semibold mt-0.5">${esc(d)}</div></div>`}).join('')}</div>`;
}
function vCampus(){return `${head('Campus Heatmap','Live open issues by block')}${heat()}`}
function clusters(){const m={};S.tickets.filter(open).forEach(t=>{const k=t.dept+'|'+t.category;(m[k]=m[k]||[]).push(t)});return Object.values(m).filter(a=>a.length>=3).sort((a,b)=>b.length-a.length)}

/* ============ STAFF ============ */
function sHome(){
  const mine=S.tickets.filter(t=>t.assignedTo===S.me.mobile&&t.approval==='approved'),act=mine.filter(t=>t.status!=='Resolved'),done=mine.filter(t=>t.status==='Resolved');
  return `${head('My Jobs',esc(S.me.trade||'Staff')+' • assigned by admin')}
  <div class="grid grid-cols-2 gap-2">${stat('Active',act.length,'text-blue-400')}${stat('Completed',done.length,'text-emerald-400')}</div>
  ${act.map(t=>tk(t,`<div class="flex gap-2 pt-2 border-t border-[#1E2B45]">${t.status==='Open'?`<button onclick="setStatus('${t.id}','In Progress')" class="${B} bg-slate-700 hover:bg-slate-600 flex-1 text-xs">Start work</button>`:''}<button onclick="resolveM('${t.id}')" class="${B} bg-emerald-600 hover:bg-emerald-500 flex-1 text-xs">Done & Upload Proof</button></div>`)).join('')||empty('No active jobs assigned to you')}
  ${done.length?`<div class="text-xs font-bold uppercase tracking-wider text-slate-300 pt-2">Completed</div>${done.slice(0,8).map(t=>tk(t)).join('')}`:''}`;
}
async function setStatus(id,s){try{await K.doc(id).update({status:s,updatedAt:now()});toast('Status: '+s)}catch(e){toast(e.message)}}
function resolveM(id){
  modal(`<h3 class="font-bold">Close ticket ${'T-'+id.slice(-4).toUpperCase()}</h3>${lbl('Fix note')}<textarea id="rnote" rows="3" placeholder="What was fixed?" class="${INP} resize-none"></textarea>
  ${lbl('Proof photo')}<input type="file" id="rproof" accept="image/*" capture="environment" class="${INP} !text-xs">
  <div class="flex gap-2"><button onclick="closeM()" class="${B} bg-slate-700 flex-1">Cancel</button><button id="rbtn" onclick="doResolve('${id}')" class="${B} bg-emerald-600 flex-1">Mark Resolved</button></div>`);
}
async function doResolve(id){
  const note=$('rnote').value.trim();if(!note)return toast('Add a fix note');
  const b=$('rbtn');b.disabled=true;b.textContent='Saving…';
  try{const proofUrl=await tryUpload($('rproof').files[0]);await K.doc(id).update({status:'Resolved',resolvedNote:note,proofUrl,resolvedBy:S.me.name,resolvedAt:now(),updatedAt:now()});closeM();toast('Ticket resolved')}
  catch(e){if(e.message!=='cancelled')toast(e.message);b.disabled=false;b.textContent='Mark Resolved'}
}

/* ============ ADMIN ============ */
function aHome(){
  const T=S.tickets,ap=T.filter(t=>t.approval==='approved'),cl=clusters();
  return `${head('Admin Dashboard','Live overview of the whole campus')}
  <div class="grid grid-cols-2 gap-2">${stat('Pending approval',pendingCount(),'text-amber-400')}${stat('Open',ap.filter(t=>t.status==='Open').length,'text-white')}${stat('In progress',ap.filter(t=>t.status==='In Progress').length,'text-blue-400')}${stat('Resolved',ap.filter(t=>t.status==='Resolved').length,'text-emerald-400')}</div>
  ${cl.length?`<div class="text-xs font-bold uppercase tracking-wider text-red-400">Root-cause alerts</div>${cl.map(g=>`<div class="${CARD} !border-red-500/40 bg-red-500/5"><div class="text-sm font-semibold">${esc(g[0].category)} — ${esc(g[0].dept)}</div><div class="text-[11px] text-slate-400 mt-0.5">${g.length} open reports share this block and category. Send one technician to check the common source.</div></div>`).join('')}`:''}
  ${ap.filter(t=>t.hazard&&t.status!=='Resolved').length?`<div class="text-xs font-bold uppercase tracking-wider text-red-400">Open hazards</div>${ap.filter(t=>t.hazard&&t.status!=='Resolved').map(t=>tk(t,adminAct(t))).join('')}`:''}
  <div class="text-xs font-bold uppercase tracking-wider text-slate-300 pt-1">Campus heatmap</div>${heat()}`;
}
function aApprovals(){
  const pt=S.tickets.filter(t=>t.approval==='pending'),pu=S.users.filter(u=>u.status==='pending');
  return `${head('Approvals','Review reports and new student accounts')}
  <div class="text-xs font-bold uppercase tracking-wider text-slate-300">Reports (${pt.length})</div>
  ${pt.map(t=>tk(t,`<div class="flex gap-2 pt-2 border-t border-[#1E2B45]"><button onclick="approve('${t.id}')" class="${B} bg-emerald-600 hover:bg-emerald-500 flex-1 text-xs"><i class="fa-solid fa-check"></i> Approve</button><button onclick="rejectM('${t.id}')" class="${B} bg-red-600/80 hover:bg-red-500 flex-1 text-xs"><i class="fa-solid fa-xmark"></i> Reject</button></div>`)).join('')||empty('No reports waiting')}
  <div class="text-xs font-bold uppercase tracking-wider text-slate-300 pt-2">Student sign-ups (${pu.length})</div>
  ${pu.map(u=>`<div class="${CARD} flex items-center justify-between gap-2"><div><div class="text-[13px] font-semibold">${esc(u.name)}</div><div class="text-[11px] text-slate-400">${esc(u.mobile)} • ${esc(u.dept)}</div></div><div class="flex gap-1.5"><button onclick="userSet('${u.id}','active')" class="${B} bg-emerald-600 px-3 text-xs">Approve</button><button onclick="userSet('${u.id}','rejected')" class="${B} bg-red-600/80 px-3 text-xs">Reject</button></div></div>`).join('')||empty('No sign-ups waiting')}`;
}
async function approve(id){try{await K.doc(id).update({approval:'approved',approvedBy:S.me.name,updatedAt:now()});toast('Approved')}catch(e){toast(e.message)}}
function rejectM(id){modal(`<h3 class="font-bold">Reject report</h3><textarea id="rrsn" rows="3" placeholder="Reason (student will see this)" class="${INP} resize-none"></textarea><div class="flex gap-2"><button onclick="closeM()" class="${B} bg-slate-700 flex-1">Cancel</button><button onclick="doReject('${id}')" class="${B} bg-red-600 flex-1">Reject</button></div>`)}
async function doReject(id){try{await K.doc(id).update({approval:'rejected',rejectReason:$('rrsn').value.trim()||'Not valid',updatedAt:now()});closeM();toast('Rejected')}catch(e){toast(e.message)}}
function adminAct(t){
  if(t.approval!=='approved')return `<div class="flex gap-2 pt-2 border-t border-[#1E2B45]">${t.approval==='rejected'?`<button onclick="approve('${t.id}')" class="${B} bg-emerald-600 flex-1 text-xs">Approve anyway</button>`:''}<button onclick="delT('${t.id}')" class="${B} bg-slate-700 px-4 text-xs text-red-400"><i class="fa-solid fa-trash"></i></button></div>`;
  const staff=S.users.filter(u=>u.role==='staff'&&u.status==='active');
  return `<div class="flex gap-2 pt-2 border-t border-[#1E2B45]"><select onchange="assign('${t.id}',this.value)" class="${INP} !py-2 !text-xs flex-1"><option value="">Assign staff…</option>${staff.map(u=>`<option value="${u.mobile}" ${t.assignedTo===u.mobile?'selected':''}>${esc(u.name)} (${esc(u.trade||'')})</option>`).join('')}</select>
  ${t.status!=='Resolved'?`<button onclick="resolveM('${t.id}')" class="${B} bg-emerald-600 px-3 text-xs">Close</button>`:`<button onclick="setStatus('${t.id}','Open')" class="${B} bg-slate-700 px-3 text-xs">Reopen</button>`}<button onclick="delT('${t.id}')" class="${B} bg-slate-700 px-3 text-xs text-red-400"><i class="fa-solid fa-trash"></i></button></div>`;
}
async function assign(id,m){const u=S.users.find(x=>x.mobile===m),t=S.tickets.find(x=>x.id===id);try{await K.doc(id).update({assignedTo:m,assignedName:u?u.name:'',status:m&&t.status==='Open'?'In Progress':t.status,updatedAt:now()});toast(m?'Assigned to '+u.name:'Unassigned')}catch(e){toast(e.message)}}
async function delT(id){if(confirm('Delete this ticket permanently?'))try{await K.doc(id).delete()}catch(e){toast(e.message)}}
function aTickets(){
  const f=S.filter,L=S.tickets.filter(t=>f==='all'||(f==='pending'&&t.approval==='pending')||(f==='rejected'&&t.approval==='rejected')||(t.approval==='approved'&&((f==='open'&&t.status==='Open')||(f==='progress'&&t.status==='In Progress')||(f==='resolved'&&t.status==='Resolved'))));
  const chips=[['all','All'],['pending','Pending'],['open','Open'],['progress','In Progress'],['resolved','Resolved'],['rejected','Rejected']];
  return `${head('All Tickets','Assign, close, reopen or delete')}
  <div class="flex gap-1.5 overflow-x-auto sc pb-1">${chips.map(([k,l])=>`<button onclick="S.filter='${k}';go('tickets')" class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-semibold border ${f===k?'bg-blue-600 border-blue-600 text-white':'border-[#1E2B45] text-slate-400'}">${l}</button>`).join('')}</div>
  ${L.map(t=>tk(t,adminAct(t))).join('')||empty('No tickets in this view')}`;
}
/* users */
function aUsers(){
  const grp=(t,r)=>{const L=S.users.filter(u=>u.role===r&&u.status!=='pending');return `<div class="text-xs font-bold uppercase tracking-wider text-slate-300 pt-2">${t} (${L.length})</div>${L.map(uc).join('')||empty('None yet')}`};
  return `${head('User Management','Create IDs for staff and admins')}<button onclick="userM()" class="${B} ${P} w-full py-3"><i class="fa-solid fa-user-plus mr-1"></i> Create Staff / Admin ID</button>${grp('Staff','staff')}${grp('Admins','admin')}${grp('Students','student')}`;
}
function uc(u){
  const me=u.id===S.me.id,st={active:'green',blocked:'red',rejected:'red'}[u.status]||'slate';
  return `<div class="${CARD} space-y-2"><div class="flex justify-between items-start"><div><div class="text-[13px] font-semibold">${esc(u.name)} ${me?'<span class="text-[10px] text-slate-500">(you)</span>':''}</div><div class="text-[11px] text-slate-400"><i class="fa-solid fa-phone text-[9px]"></i> ${esc(u.mobile)} • ${esc(u.trade||u.dept||'')}</div></div>${bd(u.status,st)}</div>
  ${me?'':`<div class="flex gap-2"><button onclick="userSet('${u.id}','${u.status==='active'?'blocked':'active'}')" class="${B} bg-slate-700 flex-1 text-xs">${u.status==='active'?'Block':'Unblock'}</button><button onclick="pwM('${u.id}')" class="${B} bg-slate-700 flex-1 text-xs">Reset password</button><button onclick="delU('${u.id}')" class="${B} bg-slate-700 px-3 text-xs text-red-400"><i class="fa-solid fa-trash"></i></button></div>`}</div>`;
}
async function userSet(id,s){try{await U.doc(id).update({status:s});toast('User '+s)}catch(e){toast(e.message)}}
async function delU(id){if(confirm('Delete this user?'))try{await U.doc(id).delete()}catch(e){toast(e.message)}}
function userM(){
  modal(`<h3 class="font-bold">Create ID</h3><select id="nr" onchange="$('nt').classList.toggle('hidden',this.value!=='staff')" class="${INP}"><option value="staff">Staff / Worker</option><option value="admin">Admin</option></select>
  <input id="nn" placeholder="Full name" class="${INP}"><input id="nm" inputmode="numeric" maxlength="10" placeholder="Mobile number (login ID)" class="${INP}"><select id="nt" class="${INP}">${opts(TRADES)}</select><input id="np" placeholder="Password (min 6)" class="${INP}">
  <div class="flex gap-2"><button onclick="closeM()" class="${B} bg-slate-700 flex-1">Cancel</button><button onclick="createUser()" class="${B} ${P} flex-1">Create</button></div>`);
}
async function createUser(){
  const role=$('nr').value,name=$('nn').value.trim(),m=$('nm').value.trim(),p=$('np').value;
  if(name.length<2||!/^\d{10}$/.test(m)||p.length<6)return toast('Need name, 10-digit mobile and 6+ char password');
  try{
    if((await U.doc(m).get()).exists)return toast('Mobile number already in use');
    await U.doc(m).set({name,mobile:m,role,trade:role==='staff'?$('nt').value:'',status:'active',pass:await hash(m,p),createdBy:S.me.name,createdAt:now()});
    closeM();toast('ID created. Share: '+m+' / '+p);
  }catch(e){toast(e.message)}
}
function pwM(id){modal(`<h3 class="font-bold">Reset password</h3><input id="npw" placeholder="New password (min 6)" class="${INP}"><div class="flex gap-2"><button onclick="closeM()" class="${B} bg-slate-700 flex-1">Cancel</button><button onclick="setPw('${id}')" class="${B} ${P} flex-1">Save</button></div>`)}
async function setPw(id){const p=$('npw').value;if(p.length<6)return toast('Min 6 characters');try{await U.doc(id).update({pass:await hash(id,p)});closeM();toast('Password updated')}catch(e){toast(e.message)}}
/* settings */
function aSettings(){
  return `${head('Settings')}
  <div class="${CARD} space-y-2.5"><div class="text-sm font-semibold">Cloudinary photo upload</div><p class="text-[11px] text-slate-400">Cloud name: <b class="text-slate-200">${CLOUD}</b>. Enter your <b>unsigned</b> upload preset name (Cloudinary → Settings → Upload → Upload presets).</p>
  <input id="cp" value="${esc(S.cfg.cloudPreset||DEFAULT_PRESET)}" class="${INP}"><button onclick="saveCfg()" class="${B} ${P} w-full">Save preset</button></div>
  <div class="${CARD} space-y-2.5"><div class="text-sm font-semibold">Change my password</div><input id="mp" type="password" placeholder="New password (min 6)" class="${INP}"><button onclick="myPw()" class="${B} bg-slate-700 w-full">Update password</button></div>`;
}
async function saveCfg(){try{await C.set({cloudPreset:$('cp').value.trim()},{merge:true});toast('Preset saved')}catch(e){toast(e.message)}}
async function myPw(){const p=$('mp').value;if(p.length<6)return toast('Min 6 characters');try{await U.doc(S.me.id).update({pass:await hash(S.me.id,p)});$('mp').value='';toast('Password changed')}catch(e){toast(e.message)}}

/* ============ BOOT ============ */
render();
(async()=>{const m=localStorage.getItem('sentinelMobile');if(m)try{const d=await U.doc(m).get();if(d.exists&&d.data().status==='active')start(m)}catch(e){}})();
setInterval(()=>{if(S.me&&!['report','settings'].includes(S.tab))render()},60000);
</script>
</body>
</html>
